<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background atmospheric glow -->
    <radialGradient id="centerNebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4C1D95" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#1E1B4B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#07050A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#07050A"/>
  <rect width="1200" height="630" fill="url(#centerNebula)"/>

  <!-- Logo -->
  <g transform="translate(72, 54)">
    <rect width="44" height="44" rx="12" fill="#140E0A" stroke="#FF8A00" stroke-width="2"/>
    <text x="22" y="32" font-family="sans-serif" font-size="24" font-weight="700" fill="#FF9800" text-anchor="middle">S</text>
    <text x="60" y="32" font-family="sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">Shonen<tspan fill="#FF8A00">Builds</tspan></text>
  </g>

  <!-- Nav links right -->
  <g transform="translate(750, 84)" font-family="sans-serif" font-size="16" fill="#64748B" font-weight="500">
    <text x="0" y="0">Skill Tree</text>
    <text x="110" y="0">Squads</text>
    <text x="205" y="0">Ranks</text>
    <text x="290" y="0">Leaderboard</text>
  </g>

  <!-- Beta Tag -->
  <g transform="translate(480, 175)">
    <rect width="240" height="34" rx="17" fill="#120E22" stroke="#4C1D95" stroke-width="1.2"/>
    <text x="32" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#38BDF8">NOW IN BETA</text>
    <circle cx="122" cy="17" r="2" fill="#64748B"/>
    <text x="134" y="22"  font-family="sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Join  Warriors</text>
  </g>

  <!-- Headline -->
  <g font-family="sans-serif" font-size="82" font-weight="800" text-anchor="middle" letter-spacing="-2">
    <!-- Line 1 -->
    <text x="600" y="305">
      <tspan fill="#FFFFFF">Level Up. </tspan>
      <tspan fill="#818CF8">Every</tspan>
    </text>
    <!-- Line 2 -->
    <text x="600" y="395" fill="#38BDF8">Day.</text>
  </g>

  <!-- Subtitle -->
  <text x="600" y="460" font-family="sans-serif" font-size="19" fill="#94A3B8" text-anchor="middle">
    Gamified calisthenics training. Unlock skill nodes, earn XP, and climb 10 tiers of power.
  </text>

  <!-- Disciplines Pills -->
  <g transform="translate(320, 530)" font-family="sans-serif" font-size="13" font-weight="500" fill="#CBD5E1">
    <rect x="0" width="105" height="32" rx="6" fill="#0F0C1B" stroke="#1E1933"/>
    <text x="52" y="21" text-anchor="middle">Shinobi</text>

    <rect x="120" width="160" height="32" rx="6" fill="#0F0C1B" stroke="#1E1933"/>
    <text x="200" y="21" text-anchor="middle">Awakened Hunter</text>

    <rect x="295" width="115" height="32" rx="6" fill="#0F0C1B" stroke="#1E1933"/>
    <text x="352" y="21" text-anchor="middle">High Seas</text>

    <rect x="425" width="135" height="32" rx="6" fill="#0F0C1B" stroke="#1E1933"/>
    <text x="492" y="21" text-anchor="middle">Spirit Warrior</text>
  </g>
</svg>