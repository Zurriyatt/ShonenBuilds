<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1F1512"/>
      <stop offset="100%" stop-color="#0B080B"/>
    </radialGradient>

    <!-- Orange Aura Outer Glow -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#FF8A00" flood-opacity="0.35"/>
    </filter>

    <!-- 'S' Gradient -->
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect 
    x="24" y="24" 
    width="464" height="464" 
    rx="128" 
    fill="url(#bg)" 
    stroke="#FF8A00" 
    stroke-width="14" 
    stroke-opacity="0.55"
    filter="url(#amberGlow)"
  />

  <!-- Subtle Inner Border -->
  <rect 
    x="34" y="34" 
    width="444" height="444" 
    rx="118" 
    fill="none" 
    stroke="#FFA336" 
    stroke-width="2" 
    stroke-opacity="0.25"
  />

  <!-- Center "S" Letterform -->
  <text 
    x="50%" 
    y="66%" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="330" 
    font-weight="700" 
    fill="url(#sGrad)" 
    letter-spacing="-10"
  >S</text>
</svg>